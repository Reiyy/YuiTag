name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本号 / Release Tag (例如 v1.0.0-beta.1)'
        required: false
        default: ''
        type: string

jobs:
  build-and-release:
    name: Build & Publish Official Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 确定版本 Tag（支持通过 Git 推送 Tag，或在网页端 Run workflow 手动输入 Tag）
      - name: Determine Release Tag
        run: |
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              TAG="${{ github.ref_name }}"
            else
              echo "Error: 当前是在分支上运行，且未在 Run workflow 中输入 tag_name！"
              echo "GitHub Release 必须绑定一个版本 Tag（例如 v1.0.0-beta.1）。"
              exit 1
            fi
          fi
          echo "TARGET_TAG=$TAG" >> $GITHUB_ENV
          echo "Target Release Tag is: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x App/gradlew

      # 缓存并准备CoreADI
      - name: Cache CoreADI asset
        id: cache-coreadi
        uses: actions/cache@v4
        with:
          path: App/app/src/main/assets/coreadi/CoreADI.x86_64
          key: coreadi-2eafc3c79c7f41a8afbfbeaaf23ee5dab5ad5bda55ec8e54dbc0ddf1d20ce630

      - name: Install p7zip
        if: steps.cache-coreadi.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract CoreADI
        if: steps.cache-coreadi.outputs.cache-hit != 'true'
        run: |
          python3 tools/extract_coreadi.py --dest App/app/src/main/assets/coreadi

      - name: Verify CoreADI Asset
        run: |
          COREADI_FILE="App/app/src/main/assets/coreadi/CoreADI.x86_64"
          if [ ! -f "$COREADI_FILE" ]; then
            echo "Error: CoreADI asset not found at $COREADI_FILE"
            exit 1
          fi
          echo "CoreADI asset verified: $(sha256sum "$COREADI_FILE")"

      # 正式 Release 编译
      - name: Build Android Release APK
        working-directory: ./App
        run: ./gradlew assembleRelease

      # 签名、对齐与归集 Release APK
      - name: Sign & Prepare Release Assets
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-assets

          # 1. 检查签名机密并还原 keystore 证书文件
          if [ -z "$SIGNING_KEY" ]; then
            echo "Error: GitHub Secret 'SIGNING_KEY' is not set or empty!"
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 -d > release.jks
          if [ ! -s release.jks ]; then
            echo "Error: release.jks is empty after base64 decode! Please check SIGNING_KEY."
            exit 1
          fi

          # 密钥密码回退策略（若 KEY_PASSWORD 未单独设置，则默认使用 KEYSTORE_PASSWORD）
          KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          # 2. 定位 Gradle 编译生成的 APK
          RAW_APK=$(find App/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "Error: Gradle release APK not found in App/app/build/outputs/apk/release!"
            exit 1
          fi
          echo "Found APK: $RAW_APK"

          # 3. 动态定位系统最新的 Android SDK Build-Tools (包含 zipalign 与 apksigner)
          ANDROID_SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS_DIR=$(ls -d ${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          chmod +x "$ZIPALIGN" "$APKSIGNER" 2>/dev/null || true

          # 4. 执行 zipalign 4字节对齐
          ALIGNED_APK="aligned-temp.apk"
          if [ -f "$ZIPALIGN" ]; then
            echo "Running zipalign..."
            "$ZIPALIGN" -f -p 4 "$RAW_APK" "$ALIGNED_APK"
          else
            echo "Warning: zipalign not found, using raw APK"
            cp "$RAW_APK" "$ALIGNED_APK"
          fi

          # 5. 执行 apksigner 写入正式签名
          OUT_APK="release-assets/YuiTag-App-${TARGET_TAG}.apk"
          echo "Running apksigner..."
          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASS" \
            --out "$OUT_APK" \
            "$ALIGNED_APK"

          # 6. 验证签名合规性
          echo "Verifying signed APK..."
          "$APKSIGNER" verify --verbose "$OUT_APK"

          # 7. 清理敏感临时文件
          rm -f release.jks "$ALIGNED_APK"
          echo "Prepared asset: $OUT_APK"

      # 创建 GitHub Release 草稿并上传已签名的 APK
      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TARGET_TAG }}
          name: ${{ env.TARGET_TAG }}
          draft: true
          prerelease: ${{ contains(env.TARGET_TAG, 'beta') || contains(env.TARGET_TAG, 'rc') || contains(env.TARGET_TAG, 'alpha') || contains(env.TARGET_TAG, 'dev') || contains(env.TARGET_TAG, 'preview') }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
