# ============================================================
# YuiTag nRF52810 精简版项目编译配置
# 特性: 裁剪 FindMy / 裁剪 OTA / 裁剪 RTT 日志 / 无 MCUboot
# ============================================================

# --- 系统内核与时钟 ---
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_ISR_STACK_SIZE=1024
CONFIG_PM_DEVICE=y

# --- 蓝牙协议栈 (从机从设备模式) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_RX_STACK_SIZE=1280
CONFIG_BT_HCI_TX_STACK_SIZE=768
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_ID_MAX=1
CONFIG_BT_BUF_ACL_RX_SIZE=64
CONFIG_BT_BUF_ACL_TX_SIZE=64
CONFIG_BT_L2CAP_TX_MTU=64
CONFIG_BT_ATT_PREPARE_COUNT=1
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_ASSERT=n

# 优选连接参数 (由应用层 yuitag_ble_try_conn_param_update 延迟 15 秒温和更新，禁用协议栈自动无条件降速)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=48
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=72
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- 硬件真随机数熵源 (用于配对密钥生成) ---
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_NRF5_RNG=y

# --- NVS 持久化存储 ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- PWM 驱动 (压电蜂鸣器) ---
CONFIG_PWM=y

# --- SAADC 驱动 (电源轨 VDD 电池电量采集) ---
CONFIG_ADC=y

# --- 禁用控制台与 RTT 串口日志 (极度优化待机功耗与固件体积) ---
CONFIG_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_RTT_CONSOLE=n
CONFIG_UART_CONSOLE=n

# --- 射频发射功率 (最大 +4 dBm，保证最佳通信距离) ---
CONFIG_BT_CTLR_TX_PWR_ANTENNA=4
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y