# ============================================================
# YuiTag nRF52832 应用工程配置 (Zephyr / NCS)
# ============================================================

# --- 系统与时钟 ---
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1000
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=8192
# 系统工作队列执行 Find My secp224r1 软件 ECC 密钥派生运算，需分配足够栈空间 (4KB)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_PM_DEVICE=y

# --- 蓝牙外设配置 ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# 蓝牙 RX 线程负责处理 GATT 回调及协议栈调用链，配置为 4KB 以免溢出
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2
CONFIG_BT_ID_MAX=2
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_ATT_PREPARE_COUNT=8
# 优选连接参数 (由应用层 yuitag_ble_try_conn_param_update 延迟 15 秒温和更新，禁用协议栈自动无条件降速)
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=48
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=72
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# --- 加密配置 (PSA Crypto + Oberon 纯软实现；nRF52832 无硬件 CC310) ---
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ECC_SECP_R1_224=y

# --- 存储 (NVS) ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# --- PWM (无源蜂鸣器) ---
CONFIG_PWM=y

# --- ADC (SAADC 电池分压与供电电压测量) ---
CONFIG_ADC=y

# --- 控制台与日志 (SEGGER RTT) ---
CONFIG_CONSOLE=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# --- OTA DFU (基于 BLE 的 MCUmgr SMP 协议，静态注册 + 应用层安全鉴权 Hook) ---
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ENABLE_IMAGE_CHECK=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y

# 全局发射功率 (dBm)，nRF52832 最大硬件功率为 +4 dBm
CONFIG_BT_CTLR_TX_PWR_ANTENNA=4

# 允许运行时通过 Vendor-Specific HCI 指令动态调节发射功率
CONFIG_BT_HCI_VS=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y


